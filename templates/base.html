<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Library Management System</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: .5rem; text-align: left; }
    th { background: #f2f2f2; }
    form.inline { display: inline; }
    .flash { background: #eef6ff; border: 1px solid #9cc4ff; padding: .5rem; margin: .5rem 0; }
    nav a { margin-right: 1rem; }
  </style>
</head>
<body>
  <h1>Library Management System</h1>
  <nav><a href="{{ url_for('index') }}">Books</a><a href="{{ url_for('add_book') }}">Add Book</a></nav>
  {% for msg in get_flashed_messages() %}<div class="flash">{{ msg }}</div>{% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
